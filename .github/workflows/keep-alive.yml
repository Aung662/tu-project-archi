name: Keep backend awake

# Render's free tier puts the web service to sleep after ~15 minutes of no
# traffic; the next visitor then waits 30-50s for a cold start. This workflow
# pings the backend health endpoint every ~10 minutes so the server stays warm
# and users can open the site instantly at any time.
#
# Cost: free (GitHub Actions minutes for public repos are free; a ping job runs
# for a few seconds). No extra account or credit card needed.

on:
  schedule:
    # Every 10 minutes. GitHub cron is best-effort and may be delayed a few
    # minutes under load, which is fine — Render only sleeps after 15 min idle.
    - cron: '*/10 * * * *'
  # Allow running it by hand from the Actions tab too.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          echo "Pinging backend to keep it warm..."
          for i in 1 2 3; do
            code=$(curl -s -m 60 -o /dev/null -w "%{http_code}" https://tu-archive-api.onrender.com/health || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is awake."
              exit 0
            fi
            sleep 15
          done
          echo "Backend did not return 200 after retries (it may still be waking up)."
          # Don't fail the workflow on a cold-start miss; the next run will retry.
          exit 0

      - name: Warm the frontend
        run: |
          curl -s -m 60 -o /dev/null -w "frontend -> HTTP %{http_code}\n" https://tu-project-archi.vercel.app/ || true
