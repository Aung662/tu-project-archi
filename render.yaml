# Render Blueprint — deploys the TU Archive backend API + a managed PostgreSQL DB.
# Docs: https://render.com/docs/blueprint-spec
# The frontend is deployed separately on Vercel (see vercel.json).

databases:
  - name: tu-archive-db
    databaseName: tu_archive
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: tu-archive-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: tu-archive-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random value
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: COOKIE_NAME
        value: tu_token
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGIN
        sync: false # set to your Vercel URL, e.g. https://tu-archive.vercel.app
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: Platform Admin
      - key: DEFAULT_PROJECT_PRICE_MMK
        value: "5000"
      - key: PAYMENT_INSTRUCTIONS
        sync: false
    # NOTE: the free plan has an EPHEMERAL filesystem — uploaded paid files are
    # lost on redeploy. For real use, add a Render Disk mounted at the
    # PRIVATE_STORAGE_DIR path, or switch lib/storage.ts to S3 (seam provided).
    disk:
      name: tu-archive-storage
      mountPath: /opt/render/project/src/backend/storage
      sizeGB: 1
