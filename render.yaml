# Render Blueprint — deploys the TU Archive backend API + a managed PostgreSQL DB.
# Docs: https://render.com/docs/blueprint-spec
# The frontend is deployed separately on Vercel (see vercel.json).

databases:
  - name: tu-archive-db
    databaseName: tu_archive
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: tu-archive-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev is required: prisma/tsc/tsx are devDependencies and the build
    # needs them even though NODE_ENV=production (which normally skips dev deps).
    buildCommand: npm install --include=dev && npm run build
    # Free tier does NOT support preDeployCommand, so we bootstrap the database as
    # part of the start command: create/update tables (prisma db push), enable
    # pg_trgm + trigram index, seed admin + reference data, then start the API.
    # All steps are idempotent, so running them on every boot is safe.
    startCommand: npm run deploy:release && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: tu-archive-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random value
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: COOKIE_NAME
        value: tu_token
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGIN
        sync: false # set to your Vercel URL, e.g. https://tu-archive.vercel.app
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: Platform Admin
      - key: DEFAULT_PROJECT_PRICE_MMK
        value: "5000"
      - key: PAYMENT_INSTRUCTIONS
        sync: false
    # NOTE: the free plan has an EPHEMERAL filesystem and does NOT support disks,
    # so uploaded paid files are lost on redeploy/restart. This is fine for a
    # demo/thesis. For durable storage upgrade to a paid plan with a Render Disk
    # mounted at PRIVATE_STORAGE_DIR, or switch lib/storage.ts to S3 (seam
    # provided). The database (PostgreSQL) is persistent regardless.
